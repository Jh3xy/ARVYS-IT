<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Box Assignment</title>
  <style>
    body {
      color: white;
    }
    .parent{
      width: 500px;
      height: 600px;
      background-color: grey;
    }
    .child{
      width: 400px;
      height: 400px;
      background-color: green;
    }
  </style>
</head>
<body>
  <div class="parent">
    <p class="text">When I say div</p>
    <div class="child">
      <p>You say tags!</p>
    </div>
    <p class="text">I love coding</p>
  </div>
</body>
</html>
